name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8 black
      - name: flake8 (errors and undefined names only)
        run: flake8 scripts/ utils/ --max-line-length=100 --select=E9,F63,F7,F82
      - name: black (formatting check)
        run: black --check scripts/ utils/
