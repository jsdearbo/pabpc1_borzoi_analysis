name: pabpc1-borzoi
channels:
  - nvidia
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - bedtools=2.31.1
  - pip
  - pip:
    # Deep learning
    - torch==2.10.0
    - pytorch-lightning==2.6.1

    # Custom fork of tfmodisco-lite with reverse complementation optional (for use with gReLU)
    - git+https://github.com/jsdearbo/tfmodisco-lite.git@main

    # gReLU genomics library (includes Borzoi model loading and attribution)
    # Custom fork with pre-computed attribution functionality for TF-MoDISco
    - git+https://github.com/jsdearbo/gReLU.git@pre-computed-attr-modisco

    # Bioinformatics I/O
    - h5py==3.16.0
    - pysam==0.23.3
    - pyBigWig==0.3.25

    # Data science
    - numpy==1.26.4
    - pandas==2.3.3
    - scipy==1.17.1
    - scikit-learn==1.8.0

    # Visualisation
    - matplotlib==3.10.8
    - seaborn==0.13.2
    - logomaker==0.8.7
    - adjustText==1.3.0

    # Motif scanning (FIMO)
    - tangermeme==0.4.2

    # Utilities
    - pyyaml==6.0.3
    - tqdm==4.67.3
